# Build the application image and publish it to Amazon ECR.
#
# Install to: .github/workflows/build-and-push.yml
#
# Behaviour by trigger:
#   pull_request  -> build only, nothing is pushed (verification, no mutation)
#   push to main  -> build and push
#   workflow_dispatch -> manual re-run of the same build for a given ref
#
# Required repository configuration (see notes.md):
#   vars.AWS_REGION          e.g. eu-central-1
#   vars.ECR_REPOSITORY      e.g. craftpath            (repo must already exist)
#   secrets.AWS_ROLE_ARN     IAM role assumed via GitHub OIDC (no static keys)

name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One build per ref. Superseded PR builds are cancelled; main builds are never
# cancelled, so every merged commit produces an image.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build${{ github.event_name == 'push' && ' and push' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for AWS

    steps:
      - name: Check out the commit being built
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # Credentials are only needed when we actually publish. PR builds run with
      # no AWS access at all.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-build-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          # Immutable, traceable tag first; the moving tag is a convenience only.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false # ECR rejects the OCI attestation manifest by default
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
