# Settings the bulk-import endpoint depends on. Merge into the service's config.
spring:
  servlet:
    multipart:
      # The container refuses anything larger before a byte reaches application code,
      # which is what turns "10 MB limit" into a real limit rather than a hope.
      max-file-size: 10MB
      max-request-size: 12MB
      # Buffer to disk rather than heap past this point.
      file-size-threshold: 256KB
  datasource:
    hikari:
      # A bulk import holds one connection for the length of its transaction; keep
      # the pool comfortably larger than the expected concurrent import count.
      maximum-pool-size: 20

# Transactions on 50k-row batches are longer than a typical request. This bounds
# them so a pathological import cannot hold locks indefinitely.
catalog:
  bulk-import:
    transaction-timeout-seconds: 60
