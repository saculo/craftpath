# Conventions this repo already follows, promoted from prose to a check.
#
# Each rule here was measured against the existing history before being turned
# on, so none of it is an invention: every one of the 53 non-merge commits on
# master passes as written.
name: pr-standards

on: pull_request

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PRs #16-#20 were opened branch-to-branch, so master only ever received
      # their content through a later PR and the intermediate branches kept
      # merge commits master never saw. They then read as "unmerged" forever
      # while carrying no unique content. One branch, one PR, into master.
      - name: PR targets master
        run: |
          if [ "${{ github.base_ref }}" != "master" ]; then
            echo "::error::base is '${{ github.base_ref }}', not master."
            echo "Every branch is cut from master and every PR targets master."
            exit 1
          fi

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")

            # Existing history maxes out at 71. A subject that needs more than
            # 72 is usually two commits wearing one hat.
            if [ ${#subject} -gt 72 ]; then
              echo "::error::${sha:0:8} subject is ${#subject} chars (max 72): $subject"
              fail=1
            fi

            # craftpath reads these back as evidence. trailerInBranch requires
            # ONE commit carrying both, so a lone `Task:` proves nothing and
            # fails silently at `task done` rather than here.
            body=$(git log -1 --format=%B "$sha")
            if echo "$body" | grep -q '^Task: ' && ! echo "$body" | grep -q '^Work: '; then
              echo "::error::${sha:0:8} has a Task: trailer with no Work: trailer"
              fail=1
            fi

            case "$subject" in
              fixup!*|squash!*)
                echo "::error::${sha:0:8} is an unsquashed $subject"
                fail=1
                ;;
            esac
          done <<< "$(git rev-list --no-merges "$BASE..$HEAD")"
          exit $fail
