# Release when the version on master changes: publish to npm, tag, and create
# the GitHub Release.
#
# The version is NOT chosen here. It lives in package.json, gets changed in an
# ordinary reviewed PR like everything else, and merging that PR is the whole
# release ritual. This workflow notices that master now declares a version npm
# does not have, and turns it into a published package, a tag and a Release.
#
# The shape is stricli's: its publish workflow runs on every push to main and
# compares `npm view` against the version in the repo, releasing only when they
# differ. The reason for copying it rather than the more common
# bump-at-dispatch dropdown is this repository's ruleset. Master refuses direct
# pushes, so a workflow cannot commit a bump to it, and the usual ways around
# that are all worse:
#
#   - A PAT is a durable credential with write access to master living in a
#     secret, which is precisely what trusted publishing just removed.
#   - A bypass for the built-in GitHub Actions app is not available at all on a
#     personal repository: the API rejects it with "Actor GitHub actions
#     integration must be part of the ruleset source or owner organization".
#   - A release PR opened with GITHUB_TOKEN does not trigger other workflows,
#     so the `check` the ruleset requires would never run and the PR could
#     never merge.
#
# Backlog.md's alternative -- derive the version from the git tag and sync
# package.json afterwards -- was rejected for a different reason: its sync-back
# job pushes straight to main, which this ruleset also forbids, and without it
# a checkout would report a version that is not the published one. Here the
# version is one fact, and `craftpath version` reads it.
#
# `workflow_dispatch` remains for rehearsals; `dry_run` defaults to true there,
# as stricli's does: the safe thing should be what happens when someone presses
# the button without reading it.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would happen, create nothing
        type: boolean
        default: true

permissions:
  contents: write
  # npm trusted publishing: the registry verifies this workflow's OIDC identity
  # instead of a stored token, so there is no long-lived NPM_TOKEN to leak or
  # rotate -- the same reasoning that rejected a PAT above.
  id-token: write

concurrency: release

jobs:
  # Cheap, and it runs on every single push to master. Everything expensive
  # lives in `release`, which most pushes skip entirely.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does master declare a version npm does not have
        id: v
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::package.json version '$version' is not semver"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tag is the local record of a release this workflow completed.
          # It is checked first because it does not depend on the registry
          # having caught up: npm reports a new version as latest a minute or
          # so after publishing it.
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged; nothing to release"
            exit 0
          fi

          published=$(curl -fsSL "https://registry.npmjs.org/$name" | jq -r '."dist-tags".latest // empty' || true)
          if [ "$published" = "$version" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::npm already has $name@$version but v$version is not tagged"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::npm has ${published:-nothing}, master declares $version"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V: v${{ needs.decide.outputs.version }}
    steps:
      # Only reachable by dispatching from another branch: the push trigger is
      # already limited to master.
      - name: Release only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::dispatched from ${{ github.ref }}; releases are cut from master"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch master

      - run: bun install --frozen-lockfile

      # The same gate every PR passes. A release is the one place where running
      # it again is not redundant: master can go red between merge and release.
      - run: bun run check

      # What `files` in package.json actually lets through. craftpath's own
      # .claude/ is internal tooling that must not ship, and a published copy
      # missing src/ would install and then fail on first run.
      - name: Check the tarball
        run: |
          contents=$(bun pm pack --dry-run)
          echo "$contents"
          for unwanted in '.claude/' '.github/' '.test.ts'; do
            if echo "$contents" | grep -q -- "$unwanted"; then
              echo "::error::tarball contains $unwanted"
              exit 1
            fi
          done
          for required in 'bin/craftpath.ts' 'src/cli/app.ts' 'package.json'; do
            if ! echo "$contents" | grep -q -- "$required"; then
              echo "::error::tarball is missing $required"
              exit 1
            fi
          done

      # Node is here for one reason: to carry an npm new enough for trusted
      # publishing (>= 11.5.1, which itself wants Node >= 22.14). Nothing in
      # the project runs on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare npm
        run: npm install -g npm@latest

      # Publish BEFORE tagging. A tag is cheap to create and awkward to
      # retract; a failed publish after tagging leaves a version that exists in
      # git, is announced on the releases page, and cannot be installed.
      #
      # npm trusts this workflow's OIDC identity and hands back a short-lived
      # credential, then attaches a provenance attestation tying the tarball to
      # this commit and this run. That exchange lives in the npm CLI: `bun
      # publish` (1.3.10) has no OIDC support and would look for a token in
      # .npmrc that deliberately does not exist. So the one command here that
      # talks to the registry is npm's; everything else stays Bun.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      - name: Tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "$V" -m "$V"
          git push origin "$V"
          gh release create "$V" --title "$V" --generate-notes --verify-tag

      # Backlog.md proves the artifact rather than the run: it installs what it
      # just published and asks the binary its version. The registry needs a
      # moment to serve a new version, hence the retries.
      - name: Install what was published
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if out=$(bunx --bun "craftpath@$VERSION" version 2>&1); then
              echo "$out"
              case "$out" in
                *"$VERSION"*) echo "::notice::craftpath@$VERSION installs and reports $VERSION"; exit 0 ;;
                *) echo "::error::published package reports '$out', expected $VERSION"; exit 1 ;;
              esac
            fi
            echo "attempt $attempt: not installable yet"
            sleep 20
          done
          echo "::error::craftpath@$VERSION never became installable"
          exit 1

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run: nothing was created"
            echo ""
            echo "Would publish \`craftpath@${{ needs.decide.outputs.version }}\` to npm, tag \`$V\` at \`$(git rev-parse --short HEAD)\`, and cut a release."
            echo ""
            echo "Commits since the last tag:"
            echo ""
            last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$last" ]; then
              git log --no-merges --format='- %s' "$last..HEAD"
            else
              git log --no-merges --format='- %s' | head -20
              echo ""
              echo "_(no previous tag; showing the 20 most recent)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
