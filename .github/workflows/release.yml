# Cut a release from master: bump the version, publish to npm, tag, and create
# the GitHub Release.
#
# The version is not edited by hand. You choose patch, minor or major at
# dispatch; the workflow computes the number, publishes it, and only then
# commits it to master.
#
# Committing to master means a workflow pushing to a branch the ruleset
# protects. The two ways to allow that are a PAT -- a durable credential with
# write access to master, sitting in a secret -- or a bypass on the ruleset for
# the built-in GitHub Actions app. The bypass wins: nothing is created that can
# be stolen, it cannot be used outside this repository, and the only code that
# can exercise it is code that already went through a PR to reach master.
#
# The third option, having the workflow open a release PR, does not work at
# all: a PR created with GITHUB_TOKEN does not trigger other workflows, so the
# `check` the ruleset requires would never run and the PR could never merge.
#
# `dry_run` defaults to true, as stricli's does: the safe thing should be what
# happens when someone presses the button without reading it.
name: release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Report what would happen, create nothing
        type: boolean
        default: true

permissions:
  contents: write
  # npm trusted publishing: the registry verifies this workflow's OIDC identity
  # instead of a stored token, so there is no long-lived NPM_TOKEN to leak or
  # rotate -- the same reasoning that rejected a PAT above.
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Release only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::dispatched from ${{ github.ref }}; releases are cut from master"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch master

      - run: bun install --frozen-lockfile

      # The bump is written to the working tree here, ahead of `check`, so lint
      # reads the rewritten package.json and `craftpath version` is tested
      # reporting the number that is about to be published. Nothing is
      # committed until npm has accepted the tarball.
      - name: Compute the version to release
        id: v
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          current=$(jq -r .version package.json)
          case "$current" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::package.json version '$current' is not semver"; exit 1 ;;
          esac
          major=${current%%.*}
          rest=${current#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          case "$LEVEL" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown level '$LEVEL'"; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
          # --indent 4 keeps the file as biome formats it, so `check` passes.
          jq --indent 4 --arg v "$version" '.version = $v' package.json > package.json.next
          mv package.json.next package.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (was $current, $LEVEL)"

      # The same gate every PR passes. A release is the one place where running
      # it again is not redundant: master can go red between merge and release.
      - run: bun run check

      # What `files` in package.json actually lets through. craftpath's own
      # .claude/ is internal tooling that must not ship, and a published copy
      # missing src/ would install and then fail on first run.
      - name: Check the tarball
        run: |
          contents=$(bun pm pack --dry-run)
          echo "$contents"
          for unwanted in '.claude/' '.github/' '.test.ts'; do
            if echo "$contents" | grep -q -- "$unwanted"; then
              echo "::error::tarball contains $unwanted"
              exit 1
            fi
          done
          for required in 'bin/craftpath.ts' 'src/cli/app.ts' 'package.json'; do
            if ! echo "$contents" | grep -q -- "$required"; then
              echo "::error::tarball is missing $required"
              exit 1
            fi
          done

      # Node is here for one reason: to carry an npm new enough for trusted
      # publishing (>= 11.5.1, which itself wants Node >= 22.14). Nothing in
      # the project runs on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Publish BEFORE tagging. A tag is cheap to create and awkward to
      # retract; a failed publish after tagging leaves a version that exists in
      # git, is announced on the releases page, and cannot be installed.
      #
      # npm trusts this workflow's OIDC identity and hands back a short-lived
      # credential, then attaches a provenance attestation tying the tarball to
      # this commit and this run. That exchange lives in the npm CLI: `bun
      # publish` (1.3.10) has no OIDC support and would look for a token in
      # .npmrc that deliberately does not exist. So the one command here that
      # talks to the registry is npm's; everything else stays Bun.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          npm install -g npm@latest
          npm publish --access public

      # Master only learns the new version once npm has taken it. A publish
      # that fails therefore leaves master exactly as it was, and the same
      # dispatch can be pressed again without cleaning anything up.
      - name: Commit the bump, tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: v${{ steps.v.outputs.version }}
        run: |
          git add package.json
          git commit -m "Release $V"
          git tag -a "$V" -m "$V"
          git push origin HEAD:master
          git push origin "$V"
          gh release create "$V" --title "$V" --generate-notes --verify-tag

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          V: v${{ steps.v.outputs.version }}
        run: |
          {
            echo "### Dry run: nothing was created"
            echo ""
            echo "Would publish \`craftpath@${{ steps.v.outputs.version }}\` to npm, commit that bump to master on top of \`$(git rev-parse --short HEAD)\`, tag \`$V\`, and cut a release."
            echo ""
            echo "Commits since the last tag:"
            echo ""
            last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$last" ]; then
              git log --no-merges --format='- %s' "$last..HEAD"
            else
              git log --no-merges --format='- %s' | head -20
              echo ""
              echo "_(no previous tag; showing the 20 most recent)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
