# Lint, typecheck and suite on every push and pull request.
#
# `bun run check` is the same command the repo rule asks a developer to run, so
# CI and local verification cannot drift into meaning different things.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned rather than `latest`: the suite leans on Bun-specific behaviour
      # (Bun.YAML, Bun.TOML, Bun.$, Bun.spawn timeouts), so a runtime bump
      # should be a deliberate commit, not a surprise on an unrelated PR.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      # The tests shell out to git (trailers, signed acks and approvals are read
      # from git config), and a runner has no identity configured.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch master

      - run: bun install --frozen-lockfile

      # Blocks on high and critical only. A new moderate advisory in a
      # transitive dependency should not turn an unrelated PR red; Dependabot
      # opens a PR for it either way, and that is where it gets triaged.
      - run: bun audit --audit-level=high

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test
