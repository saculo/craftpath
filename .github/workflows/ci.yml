# Typecheck and suite on every push and pull request.
#
# `bun run check` is the same command the repo rule asks a developer to run, so
# CI and local verification cannot drift into meaning different things.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest`: the suite leans on Bun-specific behaviour
      # (Bun.YAML, Bun.TOML, Bun.$, Bun.spawn timeouts), so a runtime bump
      # should be a deliberate commit, not a surprise on an unrelated PR.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The tests shell out to git (trailers, signed acks and approvals are read
      # from git config), and a runner has no identity configured.
      - name: Configure git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch master

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test
