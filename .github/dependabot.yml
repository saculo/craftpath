# Dependency updates.
#
# Grouped so that a routine bump is one PR to review rather than four. Each one
# still goes through the same `check` the ruleset requires, so a bump that
# breaks the suite cannot land.
version: 2
updates:
  # `bun`, not `npm`. The npm ecosystem updates package.json and leaves
  # bun.lock untouched, so every PR it opens is born red against
  # `bun install --frozen-lockfile` -- which is exactly what happened to the
  # first one. Bun has been a first-class ecosystem since February 2025.
  #
  # Note it covers version updates only; Dependabot security updates still run
  # through npm detection and can still produce a stale lockfile.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    commit-message:
      prefix: "Bump"

  # Actions are pinned by SHA in the workflows, which makes them invisible to a
  # human reading the file and impossible to update by hand. Dependabot
  # understands the `# v4` comment and moves the SHA with the tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
