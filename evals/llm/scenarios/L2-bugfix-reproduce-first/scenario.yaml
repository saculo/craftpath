# A bug report: the fix has to start from a test that reproduces it, and
# that test has to fail without the fix.
id: L2-bugfix-reproduce-first
fixture: bun-cli-with-bug
harnesses: [claude-code, pi]
trials: 1
budget: { turns: 100, usd: 2, minutes: 25 }
gates: { requirement: auto, plan: auto, result: auto }
prompt: "Users report that `bun src/cli.ts done 3` marks item 2 as done instead of item 3. Fix it."
graders:
  - no_timeout
  - validate_complete
  - red_before_green
  - test_fails_without_fix
  - no_state_writes
  - verify_before_done
